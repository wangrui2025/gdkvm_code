defaults:
  - _self_
  - model: base  # keep this line if you have a model sub-config

# =======================
# general
# =======================
exp_id: "camus_10f_semi"         # experiment name
seed: 42                     # random seed
debug: false                 # debug mode
cudnn_benchmark: true
log_text_interval: 10        # text log interval (iters)
log_image_interval: 50       # image log interval (iters)
save: 0                      # save model
save_weights_interval: 200    # save weights interval (iters)
save_checkpoint_interval: 200 # save checkpoint interval (iters)

data_path: "/data/camus_png256x256_10f_20250709/"

# =======================
# main training
# =======================
main_training:
  name: "main_training"
  enabled: true
  batch_size: 12
  num_workers: 48
  amp: true
  num_iterations: 3000         # total iterations
  learning_rate: 1.0e-4
  lr_schedule: step            # "constant", "poly", "step"
  lr_schedule_gamma: 0.1
  point_supervision: true
  train_num_points: 12544
  oversample_ratio: 3.0
  importance_sample_ratio: 0.75

  clip_grad_norm: 3.0
  weight_decay: 0.001
  embed_weight_decay: 0.0
  backbone_lr_ratio: 0.1
  lr_schedule_steps: [1000, 2000]

  num_ref_frames: 10
  seq_length: 10
  num_objects: 1
  crop_size: [256, 256]

  # custom loss / hyperparams
  pos_weight_val: 2.0

# keep a pre-training stage if needed; otherwise set enabled=false or delete
pre_training:
  enabled: false

# =======================
# val / eval
# =======================
val:
  enabled: true  # run validation during training

# eval_stage is for standalone inference/eval; can also be called after training
eval_stage:
  name: "eval_stage"
  amp: false
  # batch_size:
  # num_workers:
  eval_interval: 10
  num_vis: 1
  crop_size: [256, 256]
  learning_rate: 1e-4
  weight_decay: 1e-3
  lr_schedule: "constant"
  clip_grad_norm: 0.0
  point_supervision: false
  train_num_points: 0
  oversample_ratio: 3.0
  importance_sample_ratio: 0.75
  embed_weight_decay: 0.0
  backbone_lr_ratio: 0.1
